name: Provider host checks
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSRTMUX_ENABLE_SANITIZERS=ON -DSRTMUX_BUILD_PROVIDERS=ON -DSRTMUX_BUILD_BENCHMARKS=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

  real-providers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSRTMUX_BUILD_PROVIDERS=ON -DSRTMUX_BUILD_BENCHMARKS=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
      - name: Build unmodified pinned Haivision reference application
        run: |
          cmake -S build/_deps/haivision-src -B build-reference -DCMAKE_BUILD_TYPE=Release -DENABLE_APPS=ON -DENABLE_TESTING=OFF -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DUSE_ENCLIB=openssl
          cmake --build build-reference --target srt-live-transmit --parallel 4
      - name: Check upstream application interoperability
        run: python3 tests/live_transmit_reference_test.py build/apps/srt-live-transmit build-reference/srt-live-transmit build/providers/libsrtmux_robotweax.so build/providers/libsrtmux_haivision.so
      - name: Install and check application bundle
        run: |
          cmake --install build --prefix "$PWD/build/package" --component SrtMux
          python3 tests/live_transmit_bundle_test.py build/package
          python3 tools/write_bundle_manifest.py build/package
          tar -czf build/srt-live-transmit-${{ runner.os }}-${{ runner.arch }}.tar.gz -C build/package .
      - uses: actions/upload-artifact@v4
        with:
          name: srt-live-transmit-${{ runner.os }}-${{ runner.arch }}
          path: build/srt-live-transmit-*.tar.gz
          if-no-files-found: error
